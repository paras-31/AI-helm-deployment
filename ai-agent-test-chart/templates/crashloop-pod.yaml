{{- if and .Values.enabled .Values.scenarios.crashloop.enabled }}
# Scenario 1 — CrashLoopBackOff (app exits immediately)
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.scenarios.crashloop.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.scenarios.crashloop.name }}
    scenario: crashloop
    {{- include "ai-agent-test.labels" . | nindent 4 }}
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: {{ .Values.scenarios.crashloop.image }}
      command:
        - sh
        - -c
        - |
          echo "{{ .Values.scenarios.crashloop.name }}: simulating avm-api startup failure"
          echo "ERROR: connection refused to redis-master.platform.svc.cluster.local:6379"
          exit 1
{{- end }}
