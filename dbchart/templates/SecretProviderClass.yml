apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-secret-provider
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    objects:
      - objectName: "db-secret"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectKey: "POSTGRES_USER"
          - path: password
            objectKey: "POSTGRES_PASSWORD"
          - path: database
            objectKey: "POSTGRES_DB"
  secretObjects:
    - secretName: "db-secret"
      type: Opaque
      data:
        - path: POSTGRES_USER
          key: "POSTGRES_USER"
        - path: POSTGRES_PASSWORD
          key: "POSTGRES_PASSWORD"
        - path: POSTGRES_DB
          key: "POSTGRES_DB"