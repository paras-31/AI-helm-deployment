apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-secret-provider
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.aws.region }}
    objects: |
      - objectName: "POSTGRES_PASSWORD"
        objectType: "secretsmanager"
        # The AWS secret is an RDS-style JSON blob; split it into the discrete
        # env vars the postgres image expects instead of mounting it raw.
        jmesPath:
          - path: "username"
            objectAlias: "POSTGRES_USER"
          - path: "password"
            objectAlias: "POSTGRES_PASSWORD"
          - path: "dbname"
            objectAlias: "POSTGRES_DB"
  secretObjects:
    - secretName: {{ .Values.secrets.k8sSecretName }}
      type: Opaque
      data:
        - objectName: "POSTGRES_USER"
          key: "POSTGRES_USER"
        - objectName: "POSTGRES_PASSWORD"
          key: "POSTGRES_PASSWORD"
        - objectName: "POSTGRES_DB"
          key: "POSTGRES_DB"
