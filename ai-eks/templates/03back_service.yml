apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.nameOverride }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ai-eks.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "ai-eks.backendName" . }}
