apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-eks.frontendName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "ai-eks.frontendName" . }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ include "ai-eks.frontendName" . }}
