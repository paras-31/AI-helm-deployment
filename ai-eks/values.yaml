# Default values for ai-eks.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

namespace: ai-speaking
resourceQuota:
  enabled: true
  hard:
    pods: "20"
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
# Argo CD Application uses CreateNamespace=true. Do not emit a Namespace
# object from this chart or sync fails when the project cannot create it.
createNamespace: true


# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
frontend:
  image:
    repository: 386370886448.dkr.ecr.ap-south-1.amazonaws.com/frontend
    pullPolicy: IfNotPresent
    tag: "v20260904-80255dd"
  service:
    type: NodePort
    port: 3000
  nameOverride: "frontend"
  selectorLabels:
    app: frontend
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.


# =============================== Backend ===============================

backend:
  image:
    repository: 386370886448.dkr.ecr.ap-south-1.amazonaws.com/backend
    pullPolicy: IfNotPresent
    tag: "v20260904-80255dd"
  service:
    type: NodePort
    port: 8000
  nameOverride: "backend"
  selectorLabels:
    app: backend
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # /health is fast (~3ms) unless the single Uvicorn worker is blocked on
  # slow /api/auth calls (4–5s). Probe timeouts must exceed that or kubelet SIGKILLs (137).
  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 12
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

  # Non-secret config is rendered into a ConfigMap and injected via envFrom.
  configMapName: backend-config
  config:
    APP_NAME: "AI Speaking Backend"
    ENVIRONMENT: "production"
    DEBUG: "false"
    DATABASE_URL: "postgresql+psycopg://postgres:FhGZa6cLTqO0LucUw9AH6ALs@postgresdb.ai-db.svc.cluster.local:5432/aispeaking"
    # CORS — comma-separated. Replace with the public host(s) of the frontend.
    CORS_ORIGINS: "http://frontend.ai-speaking.svc.cluster.local:3000"
    UPLOAD_DIR: "/app/data/uploads"
    PERSIST_AUDIO: "false"   # ephemeral pod filesystem — don't try to keep audio
    MAX_AUDIO_MB: "25"
    MAX_HISTORY_TURNS: "10"
    ALLOWED_AUDIO_EXTENSIONS: "wav,mp3,m4a,webm"
    RATE_LIMIT_PER_MINUTE: "120"
    LLM_PROVIDER: "groq"
    OPENAI_BASE_URL: "https://api.groq.com/openai/v1"
    OPENAI_MODEL: "llama-3.3-70b-versatile"
    OPENAI_TIMEOUT_SECONDS: "30"
    STT_PROVIDER: "groq"
    STT_MODEL: "whisper-large-v3-turbo"
    STT_BASE_URL: "https://api.groq.com/openai/v1"

  # Secret env vars. createSecret=false because the K8s Secret is created
  # by the Secrets Store CSI driver pulling from AWS Secrets Manager
  # (configured via awsSecrets below). Do NOT put real values here.
  secretName: backend-secrets
  createSecret: false
  secrets: {}

  # AWS Secrets Manager → K8s Secret via Secrets Store CSI driver.
  # Requires the cluster to have csi-secrets-store + aws-provider installed
  # (handled by the dbchart deploy workflow) and the IAM role referenced in
  # .Values.serviceAccount.annotations.role-arn to have GetSecretValue
  # permission on the source secret.
  awsSecrets:
    enabled: true
    region: ap-south-1
    # Cross-account secret lives in account 018701995398. The AWS provider
    # requires the FULL secret ARN as objectName for cross-account access.
    sourceSecretName: "arn:aws:secretsmanager:ap-south-1:018701995398:secret:ai-troubleshooter/eks-bzBQWV"
    secretProviderClassName: backend-secret-provider
    # Keys must match the JSON field names inside the Secrets Manager secret
    # (ai-troubleshooter/eks). These are synced into the backend-secrets K8s
    # Secret and injected via envFrom. secretRef overrides backend-config for
    # any overlapping names (e.g. OPENAI_BASE_URL/OPENAI_MODEL).
    keys:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_BASE_URL
      - ANTHROPIC_MODEL
      - ATLASSIAN_API_TOKEN
      - ATLASSIAN_EMAIL
      - ATLASSIAN_SITE_URL
      - ATLASSIAN_USE_OAUTH
      - CLUSTER_NAME
      - OBSERVATION_WINDOW_SECONDS
      - ONCALL_EMAIL
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_MODEL
      - PROTECTED_RESOURCES_FILE
      - REQUEST_DESCRIPTION
      - SNS_TOPIC_ARN
      - WATCHED_NAMESPACES


# Service account used by the backend pod. The IAM role annotated here is
# what the AWS Secrets Store CSI provider assumes via IRSA to fetch the
# secret defined in backend.awsSecrets.
serviceAccount:
  create: true
  automount: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::386370886448:role/pod-backend-secrets"
    eks.amazonaws.com/role-session-name: "backend-sa"
  name: "backend-sa"

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}

  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/


# Default service values (used by test-connection and helpers)
service:
  type: ClusterIP
  port: 8000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/group.name: ai-speaking
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 3000
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 8000
        - path: /health
          pathType: Prefix
          serviceName: backend
          servicePort: 8000
  tls: []

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Per-deployment probes are configured under .Values.backend.{liveness,readiness}Probe.
# These top-level entries are intentionally left empty; the backend deployment
# template only renders probes when .Values.backend.* is set.

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
