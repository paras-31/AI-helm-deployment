name: Helm Deploy to EKS

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      action:
        description: "Deploy action"
        required: true
        type: choice
        options:
          - upgrade
          - install
          - diff-only
      chart:
        description: "Which chart to deploy"
        required: true
        type: choice
        options:
          - ai-eks
          - dbchart
          - all

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: eksdemo
  AI_EKS_RELEASE: ai-app
  AI_EKS_NAMESPACE: ai-speaking
  DB_RELEASE: ai-db
  DB_NAMESPACE: ai-db
  ROLES_ARN: arn:aws:iam::018701995398:role/ECR-UPDATE-ROLE

jobs:
  # ─── Detect what changed ───
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore:')
    outputs:
      ai_eks: ${{ steps.changes.outputs.ai_eks }}
      dbchart: ${{ steps.changes.outputs.dbchart }}
      frontend_tag_changed: ${{ steps.diff.outputs.frontend_tag_changed }}
      backend_tag_changed: ${{ steps.diff.outputs.backend_tag_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed charts
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHART="${{ github.event.inputs.chart }}"
            echo "ai_eks=$( [[ "$CHART" == "ai-eks" || "$CHART" == "all" ]] && echo true || echo false )" >> $GITHUB_OUTPUT
            echo "dbchart=$( [[ "$CHART" == "dbchart" || "$CHART" == "all" ]] && echo true || echo false )" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            echo "ai_eks=$(echo "$CHANGED" | grep -q '^ai-eks/' && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "dbchart=$(echo "$CHANGED" | grep -q '^dbchart/' && echo true || echo false)" >> $GITHUB_OUTPUT
          fi

      - name: Detect which image tags changed
        id: diff
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF=$(git diff HEAD~1 HEAD -- ai-eks/values.yaml || true)
            echo "frontend_tag_changed=$(echo "$DIFF" | grep -q '+.*frontend' && echo "$DIFF" | grep -q 'tag:' && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "backend_tag_changed=$(echo "$DIFF" | grep -q '+.*backend' && echo "$DIFF" | grep -q 'tag:' && echo true || echo false)" >> $GITHUB_OUTPUT
          else
            echo "frontend_tag_changed=true" >> $GITHUB_OUTPUT
            echo "backend_tag_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "ai-eks chart changed: ${{ steps.changes.outputs.ai_eks }}"
          echo "dbchart changed: ${{ steps.changes.outputs.dbchart }}"
          echo "Frontend tag changed: ${{ steps.diff.outputs.frontend_tag_changed }}"
          echo "Backend tag changed: ${{ steps.diff.outputs.backend_tag_changed }}"

  # ─── Bootstrap IAM (IRSA roles for AWS Secrets Manager) ───
  # Idempotently provisions pod-secretfetch and pod-backend-secrets via the
  # reusable iam_bootstrap workflow. Runs whenever either chart is being
  # deployed so a "fresh" cluster always has the roles in place before Helm
  # installs the charts that reference them in ServiceAccount annotations.
  bootstrap-iam:
    name: Bootstrap IAM roles
    needs: detect-changes
    if: |
      needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.ai_eks == 'true' || needs.detect-changes.outputs.dbchart == 'true')
    uses: ./.github/workflows/iam_bootstrap.yml
    with:
      target: all
    permissions:
      id-token: write
      contents: read

  # ─── Deploy ai-eks chart ───
  deploy-ai-eks:
    name: Deploy ai-eks
    runs-on: ubuntu-latest
    # needs detect-changes, bootstrap-iam (so IRSA roles exist), and
    # deploy-dbchart so that when chart=all is selected, dbchart (which
    # installs the Secrets Store CSI driver and EBS CSI driver) finishes
    # before ai-eks deploys. When only ai-eks is selected, deploy-dbchart
    # is skipped — GitHub Actions treats skipped jobs as successful needs,
    # so this still works.
    needs: [detect-changes, bootstrap-iam, deploy-dbchart]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.ai_eks == 'true' &&
      needs.bootstrap-iam.result == 'success' &&
      (needs.deploy-dbchart.result == 'success' || needs.deploy-dbchart.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::243284855400:role/ECR-UPDATE-ROLE
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Verify cluster prerequisites
        run: |
          echo "Checking for Secrets Store CSI driver (required for backend secrets sync)..."
          if ! kubectl get crd secretproviderclasses.secrets-store.csi.x-k8s.io >/dev/null 2>&1; then
            echo "::error::SecretProviderClass CRD not found. Run the dbchart deploy at least once to install the CSI driver."
            exit 1
          fi

          echo "Waiting for Secrets Store CSI driver DaemonSet to be ready..."
          kubectl rollout status daemonset/csi-secrets-store-secrets-store-csi-driver \
            -n kube-system --timeout=2m

          echo "Verifying tokenRequests is configured on CSIDriver (required for IRSA)..."
          AUDIENCE=$(kubectl get csidriver secrets-store.csi.k8s.io -o jsonpath='{.spec.tokenRequests[0].audience}' 2>/dev/null || true)
          if [[ "$AUDIENCE" != "sts.amazonaws.com" ]]; then
            echo "::error::CSIDriver tokenRequests audience is '$AUDIENCE', expected 'sts.amazonaws.com'."
            echo "Re-run the dbchart deploy so the helm chart updates the CSIDriver resource."
            exit 1
          fi

          echo "All CSI driver prerequisites satisfied."

      - name: Clean stale Helm-managed backend-secrets (if any)
        run: |
          # In older releases the chart created backend-secrets directly via Helm.
          # Now the CSI driver creates it. If a Helm-managed copy exists, delete it
          # so the CSI driver can create a fresh one without ownership conflict.
          if kubectl get secret backend-secrets -n ${{ env.AI_EKS_NAMESPACE }} >/dev/null 2>&1; then
            MANAGED_BY=$(kubectl get secret backend-secrets -n ${{ env.AI_EKS_NAMESPACE }} -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}' 2>/dev/null || true)
            if [[ "$MANAGED_BY" == "Helm" ]]; then
              echo "Found Helm-managed backend-secrets — deleting so CSI driver can take over."
              kubectl delete secret backend-secrets -n ${{ env.AI_EKS_NAMESPACE }}
            else
              echo "backend-secrets exists and is managed by '$MANAGED_BY' (likely CSI driver) — leaving alone."
            fi
          else
            echo "No existing backend-secrets — nothing to clean."
          fi

      - name: Helm lint
        run: helm lint ai-eks/

      - name: Helm diff (show what will change)
        run: |
          helm plugin install https://github.com/databus23/helm-diff || true
          helm diff upgrade ${{ env.AI_EKS_RELEASE }} ai-eks/ \
            --namespace ${{ env.AI_EKS_NAMESPACE }} \
            --allow-unreleased || echo "No existing release found, will do fresh install"

      - name: Check cluster state before deploy
        run: |
          echo "=== Current Deployments ==="
          kubectl get deployments -n ${{ env.AI_EKS_NAMESPACE }} -o wide 2>/dev/null || echo "Namespace not found yet"
          echo ""
          echo "=== Current Pods ==="
          kubectl get pods -n ${{ env.AI_EKS_NAMESPACE }} -o wide 2>/dev/null || echo "No pods yet"
          echo ""
          echo "=== Current Images ==="
          kubectl get deployments -n ${{ env.AI_EKS_NAMESPACE }} -o jsonpath='{range .items[*]}{.metadata.name}: {.spec.template.spec.containers[0].image}{"\n"}{end}' 2>/dev/null || true

      - name: Helm upgrade/install
        run: |
          ACTION="${{ github.event.inputs.action || 'upgrade' }}"
          if [[ "$ACTION" == "diff-only" ]]; then
            echo "Diff-only mode, skipping deploy"
            exit 0
          fi
          helm upgrade --install ${{ env.AI_EKS_RELEASE }} ai-eks/ \
            --namespace ${{ env.AI_EKS_NAMESPACE }} \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Verify backend-secrets was synced by CSI driver
        run: |
          echo "Waiting up to 60s for CSI driver to sync backend-secrets..."
          for i in $(seq 1 12); do
            if kubectl get secret backend-secrets -n ${{ env.AI_EKS_NAMESPACE }} >/dev/null 2>&1; then
              echo "backend-secrets is present in the cluster."
              KEYS=$(kubectl get secret backend-secrets -n ${{ env.AI_EKS_NAMESPACE }} -o jsonpath='{.data}' | jq -r 'keys | join(", ")')
              echo "Keys synced: $KEYS"
              exit 0
            fi
            echo "  ... not yet (attempt $i/12), sleeping 5s"
            sleep 5
          done
          echo "::error::backend-secrets never appeared. Check the AWS secret 'ai-speaking/backend' exists, the IAM role 'pod-backend-secrets' has GetSecretValue on it, and the OIDC trust policy matches system:serviceaccount:ai-speaking:backend-sa."
          kubectl describe pod -n ${{ env.AI_EKS_NAMESPACE }} -l app=backend | tail -30
          exit 1

      - name: Rollout status — Frontend
        if: needs.detect-changes.outputs.frontend_tag_changed == 'true'
        run: |
          echo "Frontend tag was updated, checking rollout..."
          kubectl rollout status deployment/frontend -n ${{ env.AI_EKS_NAMESPACE }} --timeout=3m || true

      - name: Rollout status — Backend
        if: needs.detect-changes.outputs.backend_tag_changed == 'true'
        run: |
          echo "Backend tag was updated, checking rollout..."
          kubectl rollout status deployment/backend -n ${{ env.AI_EKS_NAMESPACE }} --timeout=3m || true

      - name: Verify cluster state after deploy
        run: |
          echo "=== Deployments ==="
          kubectl get deployments -n ${{ env.AI_EKS_NAMESPACE }} -o wide
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.AI_EKS_NAMESPACE }} -o wide
          echo ""
          echo "=== Desired vs Actual ==="
          kubectl get deployments -n ${{ env.AI_EKS_NAMESPACE }} -o custom-columns=\
          'NAME:.metadata.name,DESIRED:.spec.replicas,READY:.status.readyReplicas,UP-TO-DATE:.status.updatedReplicas,IMAGE:.spec.template.spec.containers[0].image'
          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ env.AI_EKS_NAMESPACE }}

      - name: Health check
        run: |
          echo "Checking if all pods are ready..."
          READY=$(kubectl get deployments -n ${{ env.AI_EKS_NAMESPACE }} -o jsonpath='{range .items[*]}{.metadata.name}: desired={.spec.replicas} ready={.status.readyReplicas}{"\n"}{end}')
          echo "$READY"
          if echo "$READY" | grep -q 'ready=<none>\|ready=0'; then
            echo "WARNING: Some deployments have no ready pods!"
            exit 1
          fi
          echo "All deployments healthy!"

  # ─── Deploy dbchart ───
  deploy-dbchart:
    name: Deploy dbchart
    runs-on: ubuntu-latest
    needs: [detect-changes, bootstrap-iam]
    if: |
      needs.detect-changes.outputs.dbchart == 'true' &&
      needs.bootstrap-iam.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLES_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Install eksctl
        run: |
          ARCH=amd64
          PLATFORM=$(uname -s)_$ARCH
          curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$PLATFORM.tar.gz"
          tar -xzf eksctl_$PLATFORM.tar.gz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Setup OIDC provider
        run: |
          eksctl utils associate-iam-oidc-provider \
            --cluster ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }} \
            --approve

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Secrets Store CSI Driver + AWS Provider
        run: |
          helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
          helm repo update

          helm upgrade --install csi-secrets-store secrets-store-csi-driver/secrets-store-csi-driver \
            --namespace kube-system \
            --set syncSecret.enabled=true \
            --set enableSecretRotation=true \
            --set 'tokenRequests[0].audience=sts.amazonaws.com'

          kubectl apply -f https://raw.githubusercontent.com/aws/secrets-store-csi-driver-provider-aws/main/deployment/aws-provider-installer.yaml

          echo "Waiting for CSI driver DaemonSet to be ready..."
          kubectl rollout status daemonset/csi-secrets-store-secrets-store-csi-driver -n kube-system --timeout=3m

          echo "Verifying CRD and CSIDriver config..."
          kubectl get crd secretproviderclasses.secrets-store.csi.x-k8s.io
          AUDIENCE=$(kubectl get csidriver secrets-store.csi.k8s.io -o jsonpath='{.spec.tokenRequests[0].audience}' 2>/dev/null || true)
          if [[ "$AUDIENCE" != "sts.amazonaws.com" ]]; then
            echo "::error::CSIDriver tokenRequests not applied (got '$AUDIENCE'). The helm chart should have set this."
            exit 1
          fi
          echo "CSI driver ready with tokenRequests audience=$AUDIENCE"

      - name: Clean existing EBS CSI iamserviceaccount (if exists)
        run: |
          STACK_NAME=eksctl-${{ env.EKS_CLUSTER }}-addon-iamserviceaccount-kube-system-ebs-csi-controller-sa

          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "Stack $STACK_NAME exists — deleting via eksctl..."
            eksctl delete iamserviceaccount \
              --name ebs-csi-controller-sa \
              --namespace kube-system \
              --cluster ${{ env.EKS_CLUSTER }} \
              --region ${{ env.AWS_REGION }} \
              --wait
            echo "CFN stack cleanup complete."
          else
            echo "Stack $STACK_NAME does not exist — nothing to clean up."
          fi

          if aws iam get-role --role-name AmazonEKS_EBS_CSI_DriverRole >/dev/null 2>&1; then
            echo "Orphan role AmazonEKS_EBS_CSI_DriverRole still exists — detaching policies and deleting..."
            for POLICY_ARN in $(aws iam list-attached-role-policies --role-name AmazonEKS_EBS_CSI_DriverRole --query 'AttachedPolicies[].PolicyArn' --output text); do
              aws iam detach-role-policy --role-name AmazonEKS_EBS_CSI_DriverRole --policy-arn "$POLICY_ARN"
            done
            aws iam delete-role --role-name AmazonEKS_EBS_CSI_DriverRole
          fi

          echo "Removing any orphan ebs-csi-controller-sa so Helm can own it cleanly..."
          kubectl delete sa ebs-csi-controller-sa -n kube-system --ignore-not-found

      - name: IAM role for EBS CSI driver
        run: |
          eksctl create iamserviceaccount \
            --name ebs-csi-controller-sa \
            --namespace kube-system \
            --cluster ${{ env.EKS_CLUSTER }} \
            --role-name AmazonEKS_EBS_CSI_DriverRole \
            --role-only \
            --attach-policy-arn arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy \
            --approve

      - name: Install EBS CSI Driver
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          helm repo add aws-ebs-csi-driver https://kubernetes-sigs.github.io/aws-ebs-csi-driver
          helm repo update
          helm upgrade --install aws-ebs-csi-driver aws-ebs-csi-driver/aws-ebs-csi-driver \
            --namespace kube-system \
            --set controller.serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::${ACCOUNT_ID}:role/AmazonEKS_EBS_CSI_DriverRole

          kubectl rollout status deployment/ebs-csi-controller -n kube-system --timeout=3m

      - name: Helm lint
        run: helm lint dbchart/ --namespace ${{ env.DB_NAMESPACE }}

      - name: Helm diff (show what will change)
        run: |
          helm plugin install https://github.com/databus23/helm-diff || true
          helm diff upgrade ${{ env.DB_RELEASE }} dbchart/ \
            --namespace ${{ env.DB_NAMESPACE }} \
            --allow-unreleased || echo "No existing release found, will do fresh install"

      - name: Helm upgrade/install
        run: |
          ACTION="${{ github.event.inputs.action || 'upgrade' }}"
          if [[ "$ACTION" == "diff-only" ]]; then
            echo "Diff-only mode, skipping deploy"
            exit 0
          fi
          helm upgrade --install ${{ env.DB_RELEASE }} dbchart/ \
            --namespace ${{ env.DB_NAMESPACE }} \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Verify database deployment
        run: |
          echo "=== DB Deployments ==="
          kubectl get deployments -n ${{ env.DB_NAMESPACE }} -o wide
          echo ""
          echo "=== DB Pods ==="
          kubectl get pods -n ${{ env.DB_NAMESPACE }} -o wide
          echo ""
          echo "=== DB Services ==="
          kubectl get svc -n ${{ env.DB_NAMESPACE }}
          echo ""
          echo "=== Helm Release ==="
          helm ls -n ${{ env.DB_NAMESPACE }}
